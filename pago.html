<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu método de pago - ReservaVuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-plane-departure text-primary"></i> ReservaVuelos
            </a>
        </div>
    </nav>

    <div class="container py-4">
        <div class="row">
            <div class="col-12">
                <div class="progress-indicator payment-progress">
                    <div class="step completed">
                        <span class="step-number">1</span>
                        <span class="step-label">Seleccionar</span>
                    </div>
                    <div class="step-line active"></div>
                    <div class="step completed">
                        <span class="step-number">2</span>
                        <span class="step-label">Datos</span>
                    </div>
                    <div class="step-line active"></div>
                    <div class="step active">
                        <span class="step-number">3</span>
                        <span class="step-label">Pago</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step">
                        <span class="step-number">4</span>
                        <span class="step-label">Confirmar</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <section class="py-4 pb-5">
        <div class="container">
            <div class="row g-4">
                <div class="col-lg-7">
                    <div class="card border-0 shadow-lg payment-card h-100">
                        <div class="card-body p-5">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
                                <div>
                                    <span class="section-kicker">Checkout simulado</span>
                                    <h1 class="fw-bold display-6 mt-2 mb-0">Selecciona tu método de pago</h1>
                                </div>
                                <span id="metodoSeleccionado" class="badge bg-light text-dark border">Selecciona una opción</span>
                            </div>

                            <form id="pagoForm">
                                <div class="row g-3 mb-4">
                                    <div class="col-md-6">
                                        <label class="payment-option">
                                            <input class="payment-radio" type="radio" name="metodoPago" value="credito" data-label="Tarjeta de Crédito">
                                            <div class="payment-option-card">
                                                <div class="d-flex align-items-center gap-3">
                                                    <div class="payment-icon"><i class="fas fa-credit-card"></i></div>
                                                    <div>
                                                        <h6 class="fw-bold mb-1">Tarjeta de Crédito</h6>
                                                        <small class="text-muted">Visa, Mastercard y Amex</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="payment-option">
                                            <input class="payment-radio" type="radio" name="metodoPago" value="debito" data-label="Tarjeta de Débito">
                                            <div class="payment-option-card">
                                                <div class="d-flex align-items-center gap-3">
                                                    <div class="payment-icon"><i class="fas fa-money-check-alt"></i></div>
                                                    <div>
                                                        <h6 class="fw-bold mb-1">Tarjeta de Débito</h6>
                                                        <small class="text-muted">Pago directo desde tu banco</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="payment-option">
                                            <input class="payment-radio" type="radio" name="metodoPago" value="paypal" data-label="PayPal">
                                            <div class="payment-option-card">
                                                <div class="d-flex align-items-center gap-3">
                                                    <div class="payment-icon"><i class="fab fa-paypal"></i></div>
                                                    <div>
                                                        <h6 class="fw-bold mb-1">PayPal</h6>
                                                        <small class="text-muted">Proceso externo simulado</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="payment-option">
                                            <input class="payment-radio" type="radio" name="metodoPago" value="transferencia" data-label="Transferencia Bancaria">
                                            <div class="payment-option-card">
                                                <div class="d-flex align-items-center gap-3">
                                                    <div class="payment-icon"><i class="fas fa-building-columns"></i></div>
                                                    <div>
                                                        <h6 class="fw-bold mb-1">Transferencia Bancaria</h6>
                                                        <small class="text-muted">Referencia virtual temporal</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                    <div class="col-12">
                                        <label class="payment-option">
                                            <input class="payment-radio" type="radio" name="metodoPago" value="crypto" data-label="Criptomonedas">
                                            <div class="payment-option-card">
                                                <div class="d-flex align-items-center gap-3">
                                                    <div class="payment-icon"><i class="fas fa-coins"></i></div>
                                                    <div>
                                                        <h6 class="fw-bold mb-1">Criptomonedas</h6>
                                                        <small class="text-muted">Simulación de validación blockchain</small>
                                                    </div>
                                                </div>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <div id="estadoPago" class="alert alert-info">
                                    El pago es una simulación. Presiona pagar para continuar.
                                </div>

                                <div class="d-flex flex-wrap gap-3">
                                    <a href="reserva.html" class="btn btn-outline-secondary btn-lg">
                                        <i class="fas fa-arrow-left"></i> Volver
                                    </a>
                                    <button type="submit" class="btn btn-primary btn-lg flex-grow-1 fw-bold" id="pagarBtn">
                                        <i class="fas fa-lock"></i> Pagar
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="card border-0 shadow-lg sticky-top payment-summary-card" style="top: 100px;">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-4">
                                <i class="fas fa-receipt"></i> Resumen de pago
                            </h5>
                            <div id="resumenPago" class="mb-4 pb-4 border-bottom">
                                <!-- Cargado por JS -->
                            </div>
                            <div id="detallesPago" class="price-breakdown mb-4">
                                <!-- Cargado por JS -->
                            </div>
                            <div class="alert alert-light border mb-0">
                                <p class="fw-bold mb-2">Beneficios incluidos</p>
                                <ul id="beneficiosPago" class="payment-benefits mb-0 ps-3">
                                    <!-- Cargado por JS -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; <span data-current-year></span> ReservaVuelos. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/vuelos.js"></script>
    <script src="js/reserva.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
