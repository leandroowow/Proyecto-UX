<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de Vuelos - ReservaVuelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<div id="filtersOverlay"></div>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm sticky-top">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fas fa-plane-departure text-primary"></i> ReservaVuelos
            </a>
            <div class="d-flex gap-2">
                <button id="darkModeBtn" class="btn btn-outline-secondary btn-sm">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="index.html" class="btn btn-outline-primary btn-sm">
                    <i class="fas fa-arrow-left"></i> Nueva búsqueda
                </a>
            </div>
        </div>
    </nav>

    <!-- Search Summary -->
    <section class="search-summary bg-light py-4 sticky-top" style="top: 56px; z-index: 99;">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-8 col-md-8">
                    <p class="mb-0">
                        <strong id="rutaInfo"></strong>
                        <span class="text-muted ms-3" id="fechaInfo"></span>
                    </p>
                </div>
                <div class="col-4 col-md-4 text-end">
                    <button class="btn btn-outline-primary btn-sm me-2 d-lg-none" id="toggleFilters">
                        <i class="fas fa-sliders-h"></i> Filtros
                    </button>
                    <a href="index.html" class="btn btn-link btn-sm text-decoration-none">
                        <i class="fas fa-edit"></i> Modificar búsqueda
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Content -->
    <div class="container-fluid py-4">
        <div class="row g-4">

            <!-- Filters Sidebar -->
            <div class="col-lg-3" id="filtersSidebar">
                <div class="card border-0 shadow-sm sticky-top" style="top: 200px;">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold mb-0">
                                <i class="fas fa-sliders-h"></i> Filtros
                            </h5>
                            <button class="btn btn-sm btn-outline-secondary d-lg-none" id="closeFilters">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>

                        <!-- Ordenar -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Ordenar por</label>
                            <select class="form-select mb-3" id="sortSelect">
                                <option value="precioAsc">Menor precio</option>
                                <option value="precioDesc">Mayor precio</option>
                                <option value="duracionAsc">Menor duración</option>
                                <option value="escalasAsc">Menor cantidad de escalas</option>
                                <option value="salidaAsc">Salida más temprana</option>
                                <option value="salidaDesc">Salida más tardía</option>
                            </select>
                        </div>

                        <!-- Precio -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2" data-bs-toggle="collapse" href="#collapsePrecio" role="button">
                                <label class="form-label fw-bold mb-0">Precio Máximo</label>
                                <i class="fas fa-chevron-down fa-xs"></i>
                            </div>
                            <div class="collapse show" id="collapsePrecio">
                                <div class="d-flex gap-2 mb-2">
                                    <span class="badge bg-light text-dark" id="priceMin">$0</span>
                                    <span class="badge bg-light text-dark" id="priceMax">$1000</span>
                                </div>
                                <input type="range" class="form-range" id="priceRange" min="0" max="1000" value="1000">
                            </div>
                        </div>

                        <!-- Aerolínea -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2" data-bs-toggle="collapse" href="#collapseAero" role="button">
                                <label class="form-label fw-bold mb-0">Aerolínea</label>
                                <i class="fas fa-chevron-down fa-xs"></i>
                            </div>
                            <div class="collapse show" id="collapseAero">
                                <div class="airline-filter-list pt-2">
                                    <div class="form-check">
                                        <input class="form-check-input airlineFilter" type="checkbox" value="LA" id="airlineLATAM" checked>
                                        <label class="form-check-label" for="airlineLATAM">LATAM</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input airlineFilter" type="checkbox" value="SK" id="airlineSky" checked>
                                        <label class="form-check-label" for="airlineSky">Sky Airline</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input airlineFilter" type="checkbox" value="JS" id="airlineJetSmart" checked>
                                        <label class="form-check-label" for="airlineJetSmart">JetSmart</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input airlineFilter" type="checkbox" value="IB" id="airlineIberia" checked>
                                        <label class="form-check-label" for="airlineIberia">Iberia</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Escalas -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2" data-bs-toggle="collapse" href="#collapseEscalas" role="button">
                                <label class="form-label fw-bold mb-0">Escalas</label>
                                <i class="fas fa-chevron-down fa-xs"></i>
                            </div>
                            <div class="collapse show" id="collapseEscalas">
                                <div class="pt-2">
                                    <div class="form-check">
                                        <input class="form-check-input escalasFilter" type="checkbox" value="0" id="directos" checked>
                                        <label class="form-check-label" for="directos">Directos</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input escalasFilter" type="checkbox" value="1" id="unaEscala" checked>
                                        <label class="form-check-label" for="unaEscala">1 Escala</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input escalasFilter" type="checkbox" value="2" id="dosEscalas" checked>
                                        <label class="form-check-label" for="dosEscalas">2+ Escalas</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Horario -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2" data-bs-toggle="collapse" href="#collapseHorario" role="button">
                                <label class="form-label fw-bold mb-0">Salida</label>
                                <i class="fas fa-chevron-down fa-xs"></i>
                            </div>
                            <div class="collapse show" id="collapseHorario">
                                <div class="pt-2">
                                    <div class="form-check">
                                        <input class="form-check-input horarioFilter" type="checkbox" value="mañana" id="mañana" checked>
                                        <label class="form-check-label" for="mañana">Mañana (6:00-12:00)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input horarioFilter" type="checkbox" value="tarde" id="tarde" checked>
                                        <label class="form-check-label" for="tarde">Tarde (12:00-18:00)</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input horarioFilter" type="checkbox" value="noche" id="noche" checked>
                                        <label class="form-check-label" for="noche">Noche (18:00-23:59)</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-outline-secondary w-100" id="clearFilters">
                            <i class="fas fa-redo"></i> Limpiar filtros
                        </button>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="col-lg-9">
                <!-- Empty State -->
                <div id="emptyState" class="text-center py-5" style="display: none;">
                    <i class="fas fa-inbox fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">No se encontraron vuelos</h5>
                    <p class="text-muted">Intenta modificar tus criterios de búsqueda</p>
                </div>

                <!-- Results Container -->
                <div id="resultsContainer" class="results-container"></div>

                <!-- Pagination -->
                <nav id="paginationNav" class="mt-5" style="display: none;">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" id="prevPage">
                            <a class="page-link" href="#"><i class="fas fa-chevron-left"></i></a>
                        </li>
                        <li class="page-item active">
                            <span class="page-link" id="pageInfo">Página 1</span>
                        </li>
                        <li class="page-item" id="nextPage">
                            <a class="page-link" href="#"><i class="fas fa-chevron-right"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">&copy; <span data-current-year></span> ReservaVuelos. Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Modal Reserva Rápida -->
    <div class="modal fade" id="reservaModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Confirmar Selección</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="vueloSeleccionadoInfo"></div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary fw-bold" id="confirmarVuelo">
                        Continuar a Reserva
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/vuelos.js"></script>
    <script src="js/reserva.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chatbot.js"></script>
</body>
</html>
